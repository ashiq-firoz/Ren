[project]
name = "ren-backend"
version = "1.0.0"
description = "Ren by f69 Labs — agentic swarm orchestrator backend"
requires-python = ">=3.11"
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  # data
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pgvector>=0.3",
  "redis>=5.0",
  # config / security
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "cryptography>=42",
  # retrieval
  "numpy>=1.26",
  "fastembed>=0.5",
  "tiktoken>=0.7",
  # documents
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "beautifulsoup4>=4.12",
  "markdown-it-py>=3.0",
  "fpdf2>=2.7",
  "pandas>=2.2",
  "matplotlib>=3.8",
  # tools
  "ddgs>=9.0",
  "mcp>=1.9",
  "duckdb>=1.0",
  "croniter>=2.0",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "pillow>=10.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
cloud = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
